version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip  # understands Poetry (pyproject.toml + poetry.lock)
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
